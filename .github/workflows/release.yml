name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to build and publish (e.g. v1.2.3). Only used when running manually - a real tag push fills this in from the pushed tag instead.'
        type: string
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Compute version from tag
        id: version
        env:
          # Empty for a real tag push (that event has no inputs at all) - falls through to
          # GITHUB_REF_NAME below, which for a tag-push trigger is the tag itself.
          DISPATCH_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          TAG_NAME="${DISPATCH_TAG_NAME:-$GITHUB_REF_NAME}"
          VERSION_NAME="${TAG_NAME#v}"

          IFS='.' read -r MAJOR MINOR PATCH REST <<< "$VERSION_NAME"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH%%[!0-9]*}"; PATCH="${PATCH:-0}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Write signing config from secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set - refusing to publish an unsigned release."
            exit 1
          fi
          KEYSTORE_PATH="${{ runner.temp }}/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$SIGNING_KEYSTORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

          # Fail fast here, with a clear message, instead of silently falling through to an
          # unsigned/wrongly-signed release several steps later: confirms the base64 actually
          # decodes to a real keystore and that the alias/passwords are correct.
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null

      - name: Build release APK
        run: |
          ./gradlew assembleLawnWithQuickstepGithubRelease \
            -PblownchartVersionName=${{ steps.version.outputs.version_name }} \
            -PblownchartVersionCode=${{ steps.version.outputs.version_code }}

      - name: Locate APK
        id: apk
        run: |
          # Must come from build/outputs/apk (the final, signed artifact) - build/intermediates
          # holds unsigned/partial copies with the exact same path tail and can appear on disk
          # first, so matching too broadly here silently picks up an unsigned APK instead.
          APK_PATH=$(find . -path '*/build/outputs/apk/lawnWithQuickstepGithub/release/*.apk' ! -name '*unsigned*' -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Could not find a built, signed release APK under build/outputs/apk."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "${{ steps.apk.outputs.path }}"

      - name: Remove temporary keystore
        if: always()
        run: |
          rm -f keystore.properties "${{ runner.temp }}/release.jks"

      - name: Generate changelog
        id: changelog
        env:
          CURRENT_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          if git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            # Real tag push: CURRENT_TAG already exists in the tag list (it's what triggered this
            # run), so skip past it to find the one before it.
            PREV_TAG=$(git tag --sort=-creatordate | grep -A1 "^${CURRENT_TAG}$" | tail -1)
            [ "$PREV_TAG" = "$CURRENT_TAG" ] && PREV_TAG=""
          else
            # Manual dispatch: CURRENT_TAG doesn't exist as a real ref yet (softprops/action-gh-release
            # creates it below, on publish) - the most recent existing tag is simply the previous one.
            PREV_TAG=$(git tag --sort=-creatordate | head -1)
          fi
          {
            echo "changelog<<EOF"
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since $PREV_TAG:"
              echo
              # HEAD, not $CURRENT_TAG: for a manual dispatch that tag isn't a resolvable ref yet.
              # HEAD is equivalent for a real tag push too, since checkout landed on that tag's commit.
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)'
            else
              echo "Initial release."
            fi
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: BlownChart ${{ steps.version.outputs.version_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.apk.outputs.path }}
          prerelease: ${{ contains(steps.version.outputs.version_name, '-') }}
