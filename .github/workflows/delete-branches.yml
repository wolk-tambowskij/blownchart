name: Delete branches

# Manual, reviewable branch cleanup: paste in exactly the branch names to remove and run it from
# the Actions tab. Defaults to a dry run (lists what it would do without touching anything) so a
# typo doesn't silently delete the wrong thing - you have to consciously flip dry_run off.

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branches to delete - one per line, or comma-separated. Never include 15-dev, 16-dev, or the repo default branch; those are refused automatically even if listed.'
        type: string
        required: true
      dry_run:
        description: 'Dry run: list what would be deleted without deleting anything'
        type: boolean
        required: true
        default: true

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Delete branches
        env:
          BRANCHES_INPUT: ${{ github.event.inputs.branches }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Normalize: split on commas, tabs, spaces, AND newlines (not just commas/newlines -
          # GitHub's workflow_dispatch string input doesn't reliably preserve line breaks
          # depending on how it's submitted, so a paste that looked newline-separated in the UI
          # can arrive here as one space-separated blob; splitting on whitespace too handles both).
          # Trims whitespace, drops blank lines.
          echo "$BRANCHES_INPUT" | tr ',\t ' '\n\n\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' > branches.txt

          if [ ! -s branches.txt ]; then
            echo "::error::No branch names parsed from input - nothing to do."
            exit 1
          fi

          PROTECTED="15-dev 16-dev main master $DEFAULT_BRANCH"
          FAILED=0

          while IFS= read -r branch; do
            is_protected=0
            for p in $PROTECTED; do
              if [ "$branch" = "$p" ]; then
                echo "::error::Refusing to delete protected branch: $branch"
                is_protected=1
                FAILED=1
              fi
            done
            [ "$is_protected" = "1" ] && continue

            if [ "$DRY_RUN" = "true" ]; then
              if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
                echo "[dry-run] would delete: $branch"
              else
                echo "[dry-run] does not exist on origin, would skip: $branch"
              fi
            else
              if git push origin --delete "$branch"; then
                echo "deleted: $branch"
              else
                echo "::warning::failed to delete (may already be gone, or protected server-side): $branch"
              fi
            fi
          done < branches.txt

          exit $FAILED
